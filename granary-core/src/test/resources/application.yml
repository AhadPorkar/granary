spring:
  datasource:
    url: jdbc:h2:mem:granary-core-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration

granary:
  data-dir: ${java.io.tmpdir}/granary-core-test-${random.uuid}
  security:
    admin-password: admin123
  storage:
    blob-stores:
      # a store of its own for the compaction tests, so their numbers do not depend on other tests' blobs
      secondary:
        path: ${granary.data-dir}/blobs-secondary
    compaction:
      # tests compact on demand; the nightly run must never race them
      enabled: false
  proxy:
    connect-timeout: 2s
    read-timeout: 5s
    failure-threshold: 2
    circuit-open-min: 500ms
    circuit-open-max: 1s
    negative-cache-ttl: 10m
    metadata-max-age: 30m

logging:
  level:
    dev.granary: INFO
